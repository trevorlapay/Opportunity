services:
  opportunity:
    build: .
    # Single-run pipeline: don't restart on clean exit, only on a crash.
    # Use cron / systemd / a host scheduler / `docker compose run` to re-trigger.
    restart: on-failure
    env_file: .env
    environment:
      - TZ=America/New_York
    volumes:
      # Persistent state: seen_items.json, sources.json, run_log.json
      - ./data:/app/data
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
